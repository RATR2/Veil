plugins {
    // see https://fabricmc.net/develop/ for new versions
    // PORT NOTE (26.3): Minecraft 26.x ships unobfuscated, so Loom dropped
    // remapping for this line - use the non-remap plugin id/implementation
    // (net.fabricmc.fabric-loom -> LoomNoRemapGradlePlugin), not
    // net.fabricmc.fabric-loom-remap (verified against FabricMC/fabric-loom
    // source at port time; current release there was v1.18.3).
    id 'net.fabricmc.fabric-loom' version '1.18.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}