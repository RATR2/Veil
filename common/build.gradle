plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = project.file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // PORT TODO (26.3): Parchment mappings for 26.3 are too recent to have been
    // confirmed from this environment (network access to maven.parchmentmc.org
    // is blocked here). Re-enable once a release is confirmed - see gradle.properties.
    // parchment {
    //     minecraftVersion = parchment_minecraft
    //     mappingsVersion = parchment_version
    // }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly 'org.jetbrains:annotations:24.0.1'
    api "gg.moonflower:molang-compiler:${molang_compiler_version}"
    api "io.github.ocelot:glsl-processor:${glsl_processor_version}"

    // PORT NOTE (26.3): no published Maven artifact exists for imguimc-common
    // on 26.3 (its "26.3" branch builds but was never run through the manual
    // release workflow upstream). Built on demand via JitPack from the exact
    // commit that added 26.3 support instead - PORT TODO: unverified whether
    // JitPack's multi-module Gradle convention (group com.github.<owner>.<repo>,
    // artifact = submodule name) matches what this build actually publishes;
    // watch the next CI run.
    compileOnly "com.github.FoundryMC.imguimc:common:86d6fa3e4014590da25a471addd64c1059859da1"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}