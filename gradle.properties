# Project
version=4.5.1
group=foundry.veil
java_version=25

# Common
# PORT TODO (26.3): verify these against official sources once this environment
# can reach maven.fabricmc.net / maven.neoforged.net / maven.parchmentmc.org -
# see PORTING_NOTES.md for details on what was and wasn't verified. Minecraft
# 26.3 is on Mojang's new YY.minor version scheme and requires Java 25 (bumped
# above) and Gradle 9.1+ (already satisfied by this repo's 9.7.1 wrapper).
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
mod_name=Veil
mod_author=amo, Cappin, Ocelot
mod_contributor=Farcr (Artist)
mod_id=veil
license=LGPLv3
description=Veil is a sophisticated collection of tools and utilities designed to facilitate advanced rendering for Minecraft mod developers. Our goal is to enable more modern game-engine level content in Java Minecraft, pushing the boundaries of what is possible in modding.
## https://projects.neoforged.net/neoforged/neoform
# PORT TODO (26.3): the NeoForm build for 26.3 could not be looked up from this
# environment. Find the real value at
# https://maven.neoforged.net/releases/net/neoforged/neoform/ before building.
neo_form_version=26.3-UNKNOWN-VERIFY
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
# PORT TODO (26.3): Minecraft 26.3 is too recent for a Parchment release to be
# confirmed from this environment, so the parchment overlay is disabled below
# (see common/build.gradle). Re-enable if/when
# https://maven.parchmentmc.org/org/parchmentmc/data/parchment-26.3/ exists.
parchment_minecraft=26.3
parchment_version=UNKNOWN-VERIFY

# Dependencies
molang_compiler_version=3.1.1.19
glsl_processor_version=0.2.3
imguimc_version=2.0.0
lwjgl_version=3.3.3
# PORT TODO (26.3): best value found via web search at port time (CraftMC
# listed a Sodium Fabric build for 26.3 as version 0.9.2); verify against
# https://maven.caffeinemc.net before building, and confirm a NeoForge build
# exists (early Vulkan-era Sodium releases may be Fabric-only at first).
sodium_version=0.9.2+mc26.3

# Fabric
## See https://fabricmc.net/develop for new versions
# PORT TODO (26.3): fabric_loader_version is a best value found via web search
# at port time (a 26.3 setup guide reported Loader 0.19.5 recommended at
# release); verify against https://meta.fabricmc.net/v2/versions/loader/26.3.
# fabric_version confirmed via Modrinth/GitHub release listing at port time
# (net.fabricmc.fabric-api 0.162.0+26.3) - see fabric/build.gradle for the
# matching no-remap dependency change this version requires.
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5

# NeoForge
## See https://projects.neoforged.net/neoforged/neoforge for new versions
# PORT TODO (26.3): best value found via web search at port time (26.3.0.1-beta
# was listed as the newest NeoForge build for 26.3, released Sep 2026, still
# beta as of early Oct 2026); verify against
# https://maven.neoforged.net/releases/net/neoforged/neoforge/ before building.
# Note NeoForge versions for 26.x encode the Minecraft version in the first
# three components (26.3.0) and the NeoForge release in the fourth.
neoforge_version=26.3.0.1-beta
neoforge_version_range=[26.3.0.1,)
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
