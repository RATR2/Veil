name: build
on:
  push:
    paths:
      - 'common/src/main/java/**'
      - 'fabric/src/main/java/**'
      - 'neoforge/src/main/java/**'
      - '**/gradle.properties'
      - '**/settings.gradle'
      - '**/build.gradle'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - '26.3'
env:
  CI: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Read Java version from gradle.properties
        id: java-version
        run: echo "version=$(grep '^java_version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ steps.java-version.outputs.version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
      - name: Execute Gradle build
        run: ./gradlew build
