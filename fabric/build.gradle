plugins {
    id 'net.fabricmc.fabric-loom'
    id 'multiloader-loader'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // PORT NOTE (26.3): no `mappings` block - Minecraft 26.x ships unobfuscated
    // (no more Mojang-mappings/Parchment remapping layer), confirmed against
    // FabricMC/fabric-loom's own no-remap test fixtures at port time.

    // PORT NOTE (26.3): under the non-remap Loom plugin, mod dependencies use
    // plain `implementation`/`compileOnly`, not `modImplementation`/
    // `modCompileOnly` - confirmed against FabricMC/fabric-loom's
    // UnobfFabricAPITest fixture at port time.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // PORT NOTE (26.3): the no-remap test fixture depends on the single
    // monolithic `fabric-api` artifact rather than per-module fabricApi.module()
    // calls; whether per-module artifacts are still published for the
    // unobfuscated line wasn't confirmed, so this uses the safer, confirmed
    // form. Re-split into individual modules if/when that's verified.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation 'org.jetbrains:annotations:24.0.1'

    compileOnly "net.caffeinemc:sodium-fabric:${sodium_version}"
    // PORT TODO (26.3): best value found via web search at port time
    // (Iris 1.11.7+26.3 was the newest Fabric build listed); verify on Modrinth.
    compileOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
    // PORT TODO (26.3): version below is stale (pinned to 1.21.x) and not
    // confirmed to exist for 26.3 - check Modrinth for the correct build.
    compileOnly "maven.modrinth:replaymod:1.21-2.6.20"
    // PORT TODO (26.3): not confirmed compatible with 26.3 - verify on Modrinth.
    compileOnly "maven.modrinth:flashback:0.32.0"
    // PORT TODO (26.3): version below is stale (pinned to 1.21.1) and not
    // confirmed to exist for 26.3 - check Modrinth for the correct build.
    compileOnly "maven.modrinth:cameratweaks:1.7.0-1.21.1"
//    compileOnly "maven.modrinth:yacl:3.6.3+1.21.1-fabric"

//    runtimeOnly "maven.modrinth:modmenu:11.0.3"
//    runtimeOnly "maven.modrinth:sodium:mc1.21.1-${sodium_version}-fabric"
//    runtimeOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
//    runtimeOnly "maven.modrinth:replaymod:1.21-2.6.20"
//    runtimeOnly "maven.modrinth:flashback:0.32.0"
//    runtimeOnly "maven.modrinth:cameratweaks:1.7.0-1.21.1"
//    runtimeOnly "maven.modrinth:yacl:3.6.3+1.21.1-fabric"
//    runtimeOnly "maven.modrinth:aaa-particles:fabric-1.21-1.4.12"
//    runtimeOnly "maven.modrinth:architectury-api:13.0.8+fabric"

    include(api("gg.moonflower:molang-compiler:${molang_compiler_version}"))
    include(api("io.github.ocelot:glsl-processor:${glsl_processor_version}"))

    // PORT TODO (26.3): disabled. No published Maven artifact exists for
    // imguimc-fabric on 26.3 (its "26.3" branch builds - confirmed via its
    // own CI run - but was never run through the manual release workflow
    // upstream). Tried building that exact commit on demand via JitPack
    // instead - CI confirmed JitPack's own build of it fails too (generic
    // "Build failed" with no detailed log available), so that route is a
    // dead end, not just unverified. Re-enable (on whichever repo actually
    // ends up serving it) once a real build exists.
    // compileOnly "com.github.FoundryMC.imguimc:fabric:86d6fa3e4014590da25a471addd64c1059859da1"
}
